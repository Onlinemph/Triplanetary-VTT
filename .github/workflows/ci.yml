name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same ref are pointless; cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The bundle is the thing players actually load; keeping one per matrix
      # leg makes a "works on 20, breaks on 22" report inspectable.
      - name: Upload bundle
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: dist-node-${{ matrix.node }}
          path: dist
          retention-days: 7

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # Style findings should not gate a rules fix. The job reports, it does not
    # block; the typecheck above is the hard gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check "src/**/*.{ts,css}" "*.{json,md}" "docs/**/*.md"

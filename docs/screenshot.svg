<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Screenshot placeholder">
  <title>Screenshot placeholder</title>
  <defs>
    <pattern id="hexes" width="52" height="60" patternUnits="userSpaceOnUse" patternTransform="translate(6 4)">
      <path d="M13 0 L39 0 L52 22.5 L39 45 L13 45 L0 22.5 Z" fill="none" stroke="#1d2a3a" stroke-width="1"/>
      <path d="M39 45 L65 45 L78 67.5 L65 90 L39 90 L26 67.5 Z" fill="none" stroke="#1d2a3a" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="20%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffb454" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="400" fill="#080c12"/>
  <rect width="960" height="400" fill="url(#hexes)"/>
  <rect width="960" height="400" fill="url(#glow)"/>

  <!-- Sol, a world with its gravity ring, and a plotted course. -->
  <circle cx="150" cy="190" r="26" fill="#ffb454"/>
  <circle cx="620" cy="150" r="16" fill="#5b8dd6"/>
  <circle cx="620" cy="150" r="46" fill="none" stroke="#25405f" stroke-width="1" stroke-dasharray="3 5"/>

  <polyline points="300,300 400,250 500,215 575,185" fill="none" stroke="#7fd1a6" stroke-width="2"/>
  <polyline points="575,185 640,196" fill="none" stroke="#7fd1a6" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="300" cy="300" r="4" fill="#7fd1a6"/>
  <circle cx="500" cy="215" r="6" fill="none" stroke="#7fd1a6" stroke-width="1.5"/>
  <rect x="566" y="176" width="18" height="18" fill="none" stroke="#7fd1a6" stroke-width="1.5"/>

  <text x="480" y="350" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#63809f">
    screenshot goes here — replace docs/screenshot.svg with a capture of a game in progress
  </text>
</svg>
